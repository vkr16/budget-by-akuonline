<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus - Budget by AkuOnline</title>
    <meta name="theme-color" content="#312E81">
    <style>
        *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F8FAFC;
            color: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .offline-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 1.25rem;
            padding: 2.25rem 1.75rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .icon-circle {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 1.25rem;
            background-color: #EEF2FF;
            color: #312E81;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            position: relative;
        }
        .icon-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 1.75rem;
            height: 1.75rem;
            background-color: #EF4444;
            color: #FFFFFF;
            border-radius: 9999px;
            border: 2px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 0.875rem;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            min-height: 46px;
            padding: 0.75rem 1.25rem;
            background-color: #312E81;
            color: #FFFFFF;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(49, 46, 129, 0.2);
        }
        .btn-retry:hover {
            background-color: #3730A3;
        }
        .btn-retry:active {
            transform: scale(0.98);
            background-color: #1E1B4B;
        }
        .brand-badge {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #94A3B8;
            font-weight: 500;
        }
        .brand-badge strong {
            color: #312E81;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="5" rx="2"/>
                <line x1="2" x2="22" y1="10" y2="10"/>
            </svg>
            <div class="icon-badge">!</div>
        </div>
        <h1>Koneksi Terputus</h1>
        <p>
            Anda sedang tidak terhubung ke jaringan internet. Pastikan koneksi Wi-Fi atau data seluler Anda aktif untuk kembali mengakses <strong>Budget by AkuOnline</strong>.
        </p>
        <button type="button" class="btn-retry" onclick="window.location.reload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
            </svg>
            <span>Coba Hubungkan Kembali</span>
        </button>
        <div class="brand-badge">
            Budget <strong>by AkuOnline</strong> PWA
        </div>
    </div>
</body>
</html>
